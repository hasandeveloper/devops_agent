services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devops_agent
      POSTGRES_PASSWORD: devops_agent
      POSTGRES_DB: devops_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_agent -d devops_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    # No host port published -- api/worker reach this over the internal Compose
    # network by service name (redis:6379). Publishing 6379 here would collide
    # with a Redis instance already running on the host outside Docker.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devops_agent:devops_agent@postgres:5432/devops_agent
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devops_agent:devops_agent@postgres:5432/devops_agent
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devops_agent:devops_agent@postgres:5432/devops_agent
      CELERY_BROKER_URL: redis://redis:6379/0
    # The RDS domain agent's boto3 calls (mcp_server.py, spawned as a subprocess of
    # this worker process) need AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY in .env --
    # boto3's default credential chain picks those up from the environment with no
    # code changes, same as it would pick up a profile outside Docker.
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m celery -A config.celery_app worker --loglevel=info

volumes:
  pgdata:
  redisdata:
